name: Update job listings

on:
  schedule:
    # Every 6 hours. Edit the cron string to change frequency (this is UTC time).
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node fetch-jobs.mjs

      - name: Commit updated data
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update job listings [automated]"
          git push
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
