<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2942;
    --navy-2: #16395c;
    --blue: #2f6fed;
    --blue-light: #eaf1ff;
    --green: #1a9d6d;
    --green-light: #e5f7ef;
    --amber: #b8860b;
    --amber-light: #fff6e0;
    --ink: #10182c;
    --muted: #64748b;
    --line: #e6eaf1;
    --bg: #f3f6fb;
    --card: #ffffff;
    --shadow: 0 1px 2px rgba(16,24,44,.04), 0 8px 24px rgba(16,24,44,.06);
    --shadow-hover: 0 4px 10px rgba(16,24,44,.06), 0 16px 36px rgba(16,24,44,.12);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
    margin: 0; background: var(--bg); color: var(--ink);
  }

  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, #1d4a78 100%);
    color: white; padding: 40px 32px 64px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(600px 300px at 85% -10%, rgba(255,255,255,.10), transparent 60%);
  }
  .hero-inner { max-width: 1160px; margin: 0 auto; position: relative; }
  .eyebrow { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #9fc0f5; font-weight: 600; margin-bottom: 10px; }
  h1 { margin: 0 0 8px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .meta { color: #c9d9ee; font-size: 13.5px; }

  .wrap { max-width: 1160px; margin: -40px auto 40px; padding: 0 32px; position: relative; }

  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .count-card {
    background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .count-card b { display:block; font-size: 26px; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
  .count-card span { font-size: 12.5px; color: var(--muted); font-weight: 500; }

  .panel { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 20px; margin-bottom: 22px; }

  .search-bar { display:flex; gap:10px; margin-bottom: 14px; }
  .search-bar input {
    flex:1; padding: 13px 16px; font-size: 15px; border: 1.5px solid var(--line); border-radius: 10px;
    background: #f8fafc; transition: border-color .15s, background .15s;
  }
  .search-bar input:focus { outline: none; border-color: var(--blue); background: white; }
  .search-bar button {
    padding: 0 18px; font-size: 13.5px; font-weight: 600; border: 1.5px solid var(--line); border-radius: 10px;
    background: white; cursor: pointer; color: var(--muted); transition: all .15s;
  }
  .search-bar button:hover { background: #f1f5f9; color: var(--ink); }

  .chips { display:flex; gap:8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: white;
    font-size: 12.5px; font-weight: 600; cursor: pointer; user-select:none; color: var(--muted); transition: all .15s;
  }
  .chip:hover { border-color: var(--blue); color: var(--blue); }
  .chip.active { background: var(--navy); color: white; border-color: var(--navy); }

  .controls { display: flex; gap: 22px; flex-wrap: wrap; align-items:center; padding-top: 14px; border-top: 1px solid var(--line); }
  .controls label { font-size: 12.5px; color: var(--muted); font-weight: 600; display:flex; align-items:center; gap:8px; }
  select, input[type=text].filter-input {
    padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 13px; background: white; color: var(--ink);
  }
  input[type=range] { width: 130px; accent-color: var(--blue); }

  .toolbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .results-count { font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .sort-select { display:flex; align-items:center; gap:8px; font-size: 12.5px; color: var(--muted); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .job-card {
    background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--line);
    box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; display:flex; flex-direction:column; gap: 10px;
  }
  .job-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

  .job-card-top { display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; }
  .company-logo {
    width: 40px; height: 40px; border-radius: 10px; background: var(--blue-light); color: var(--blue);
    display:flex; align-items:center; justify-content:center; font-weight: 800; font-size: 15px; flex-shrink:0;
  }
  .score-ring {
    width: 46px; height: 46px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 12.5px; font-weight: 800; flex-shrink:0; color: white;
  }

  .job-title { font-size: 15.5px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .job-company { font-size: 13px; color: var(--muted); font-weight: 500; }

  .job-meta-row { display:flex; flex-wrap:wrap; gap: 8px; font-size: 12px; color: var(--muted); }
  .job-meta-row span { display:flex; align-items:center; gap: 4px; }

  .badges { display:flex; gap:6px; flex-wrap: wrap; }
  .badge { display:inline-flex; align-items:center; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.contract { background: var(--green-light); color: var(--green); }
  .badge.unclear { background: var(--amber-light); color: var(--amber); }
  .badge.candidate { background: var(--blue-light); color: var(--blue); }
  .badge.fresh { background: #fde8ec; color: #c0295c; }

  .job-note { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .job-card-footer { display:flex; justify-content: space-between; align-items:center; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); }
  .job-card-footer .source { font-size: 11px; color: var(--muted); }
  .view-btn {
    padding: 7px 14px; border-radius: 8px; background: var(--navy); color: white; text-decoration: none;
    font-size: 12.5px; font-weight: 700; transition: background .15s;
  }
  .view-btn:hover { background: var(--blue); }
  .view-btn.disabled { background: #cbd5e1; pointer-events: none; }

  #empty { padding: 60px 20px; text-align: center; color: var(--muted); background: var(--card); border-radius: 16px; border: 1px dashed var(--line); font-size: 14px; }

  footer { text-align:center; color: var(--muted); font-size: 12px; padding: 20px 0 40px; }

  @media (max-width: 640px) {
    .hero { padding: 28px 18px 52px; }
    .wrap { padding: 0 16px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Sainar Solutions</div>
      <h1>Job Search — Live Dashboard</h1>
      <div class="meta" id="meta">Loading data/jobs.json…</div>
    </div>
  </div>

  <div class="wrap">
    <div class="counts" id="counts"></div>

    <div class="panel">
      <div class="search-bar">
        <input type="text" id="search" placeholder="Search anything — job title, company, skill (e.g. &quot;Java&quot; or &quot;Business Central&quot;)...">
        <button id="clearBtn" type="button">Clear all</button>
      </div>

      <div class="chips" id="chips">
        <span class="chip" data-filter="all">All</span>
        <span class="chip" data-filter="contract">Contract / C2C only</span>
        <span class="chip" data-filter="high">Best matches (80%+)</span>
        <span class="chip" data-filter="remote">Remote only</span>
      </div>

      <div class="controls">
        <label>Candidate
          <select id="fCandidate"><option value="">All</option></select>
        </label>
        <label>Location contains
          <input type="text" class="filter-input" id="fLocation" placeholder="e.g. Texas, Remote">
        </label>
        <label>Min match score: <span id="scoreVal">0</span>%
          <input type="range" id="fScore" min="0" max="95" step="5" value="0">
        </label>
      </div>
    </div>

    <div class="toolbar">
      <div class="results-count" id="resultsCount"></div>
      <div class="sort-select">
        Sort by
        <select id="sortBy">
          <option value="recent">Most recent</option>
          <option value="score">Best match</option>
          <option value="company">Company A–Z</option>
        </select>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div id="empty" style="display:none;"></div>
  </div>

  <footer>Refreshes automatically every 6 hours · Powered by Adzuna &amp; RemoteOK · Always verify before applying</footer>

<script>
  const CANDIDATE_INITIALS_COLORS = ['#2f6fed', '#1a9d6d', '#b8860b', '#c0295c', '#7c3aed'];

  function initials(name) {
    return (name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function scoreColor(score) {
    if (score >= 80) return '#1a9d6d';
    if (score >= 60) return '#2f6fed';
    return '#b8860b';
  }

  function relativeTime(dateStr) {
    if (!dateStr) return 'Unknown';
    const hrs = (Date.now() - new Date(dateStr).getTime()) / 3600000;
    if (hrs < 1) return 'Under 1h ago';
    if (hrs < 24) return `${Math.round(hrs)}h ago`;
    return `${Math.round(hrs / 24)}d ago`;
  }

  async function load() {
    let data;
    try {
      const res = await fetch('data/jobs.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data file yet');
      data = await res.json();
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'No jobs.json data yet — run the GitHub Action once (Actions tab → Update job listings → Run workflow) to populate this.';
      document.getElementById('meta').textContent = 'No data yet.';
      return;
    }

    if (!data.jobs || data.jobs.length === 0) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'No postings matched in the last run — the dashboard refreshes automatically every 6 hours, or run it manually from the Actions tab.';
      document.getElementById('meta').textContent =
        `Last updated: ${new Date(data.generatedAt).toLocaleString()} · 0 postings found`;
      return;
    }

    const windowH = data.freshnessWindowHours || 48;
    document.getElementById('meta').textContent =
      `Last updated: ${new Date(data.generatedAt).toLocaleString()} · ${data.totalFound} postings found, all posted within the last ${windowH} hours`;

    const candidates = [...new Set(data.jobs.map(j => j.candidate))];
    const fCandidate = document.getElementById('fCandidate');
    candidates.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      fCandidate.appendChild(opt);
    });

    const countsEl = document.getElementById('counts');
    countsEl.innerHTML =
      `<div class="count-card"><b>${data.totalFound}</b><span>Total postings</span></div>` +
      candidates.map(c => `<div class="count-card"><b>${data.jobs.filter(j=>j.candidate===c).length}</b><span>${c}</span></div>`).join('');

    const grid = document.getElementById('grid');
    const jobs = data.jobs.slice();

    function cardHTML(j) {
      const badgeContract = j.likelyContract
        ? '<span class="badge contract">Contract / C2C language found</span>'
        : '<span class="badge unclear">Employment type unclear — verify</span>';
      const hrsOld = j.postedDate ? (Date.now() - new Date(j.postedDate).getTime()) / 3600000 : 999;
      const freshBadge = hrsOld <= 12 ? '<span class="badge fresh">🔥 Just posted</span>' : '';
      return `
        <div class="job-card"
             data-candidate="${j.candidate}"
             data-contract="${j.likelyContract ? 'yes' : 'no'}"
             data-score="${j.matchScore}"
             data-location="${(j.location||'').toLowerCase()}"
             data-remote="${/remote/i.test(j.location||'') ? 'yes' : 'no'}"
             data-searchtext="${`${j.candidate} ${j.techStack} ${j.title} ${j.company} ${j.location} ${j.source} ${j.note}`.toLowerCase().replace(/"/g,'&quot;')}"
             data-posted="${j.postedDate || ''}"
             data-companyname="${(j.company||'').toLowerCase()}">
          <div class="job-card-top">
            <div class="company-logo">${initials(j.company)}</div>
            <div class="score-ring" style="background:${scoreColor(j.matchScore)}">${j.matchScore}%</div>
          </div>
          <div>
            <div class="job-title">${j.title}</div>
            <div class="job-company">${j.company}</div>
          </div>
          <div class="job-meta-row">
            <span>📍 ${j.location}</span>
            <span>🕐 ${relativeTime(j.postedDate)}</span>
          </div>
          <div class="badges">
            <span class="badge candidate">${j.candidate} · ${j.techStack}</span>
            ${badgeContract}
            ${freshBadge}
          </div>
          <div class="job-note">${j.note}</div>
          <div class="job-card-footer">
            <span class="source">${j.source}</span>
            ${j.link ? `<a class="view-btn" href="${j.link}" target="_blank" rel="noopener">View posting →</a>` : '<span class="view-btn disabled">No link</span>'}
          </div>
        </div>
      `;
    }

    function render(list) {
      grid.innerHTML = list.map(cardHTML).join('');
    }

    const search = document.getElementById('search');
    const clearBtn = document.getElementById('clearBtn');
    const fLocation = document.getElementById('fLocation');
    const fScore = document.getElementById('fScore');
    const scoreVal = document.getElementById('scoreVal');
    const resultsCount = document.getElementById('resultsCount');
    const sortBy = document.getElementById('sortBy');
    const chips = document.querySelectorAll('.chip');
    let activeChip = 'all';

    function sortJobs(list) {
      const mode = sortBy.value;
      return list.slice().sort((a, b) => {
        if (mode === 'score') return b.matchScore - a.matchScore;
        if (mode === 'company') return (a.company||'').localeCompare(b.company||'');
        return new Date(b.postedDate) - new Date(a.postedDate); // recent
      });
    }

    function applyFilters() {
      const q = search.value.toLowerCase().trim();
      const loc = fLocation.value.toLowerCase().trim();
      const minScore = parseInt(fScore.value, 10);
      scoreVal.textContent = minScore;

      let filtered = jobs.filter(j => {
        const searchtext = `${j.candidate} ${j.techStack} ${j.title} ${j.company} ${j.location} ${j.source} ${j.note}`.toLowerCase();
        const matchesSearch = !q || searchtext.includes(q);
        const matchesCandidate = !fCandidate.value || j.candidate === fCandidate.value;
        const matchesLocation = !loc || (j.location||'').toLowerCase().includes(loc);
        const matchesScore = j.matchScore >= minScore;
        const isRemote = /remote/i.test(j.location||'');
        const matchesChip =
          activeChip === 'all' ? true :
          activeChip === 'contract' ? j.likelyContract :
          activeChip === 'high' ? j.matchScore >= 80 :
          activeChip === 'remote' ? isRemote : true;
        return matchesSearch && matchesCandidate && matchesLocation && matchesScore && matchesChip;
      });

      filtered = sortJobs(filtered);
      render(filtered);
      resultsCount.textContent = `Showing ${filtered.length} of ${jobs.length} postings`;
    }

    [search, fCandidate, fLocation, fScore, sortBy].forEach(el => el.addEventListener('input', applyFilters));
    sortBy.addEventListener('change', applyFilters);

    clearBtn.addEventListener('click', () => {
      search.value = '';
      fLocation.value = '';
      fScore.value = 0;
      fCandidate.value = '';
      activeChip = 'all';
      chips.forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
      applyFilters();
    });

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        activeChip = chip.dataset.filter;
        chips.forEach(c => c.classList.toggle('active', c === chip));
        applyFilters();
      });
    });
    document.querySelector('.chip[data-filter="all"]').classList.add('active');

    applyFilters();
  }
  load();
</script>
</body>
</html>
