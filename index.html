<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Search - Live Dashboard</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #f4f6fa; color: #1a1a1a; }
  h1 { margin: 0 0 4px 0; font-size: 22px; color: #1F4E78; }
  .meta { color: #555; margin-bottom: 16px; font-size: 13px; }
  .counts { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .count-card { background: white; border: 1px solid #d7dee8; border-radius: 8px; padding: 10px 16px; font-size: 13px; }
  .count-card b { display:block; font-size: 18px; color: #1F4E78; }
  .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
  select, input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  th, td { border: 1px solid #dfe3ea; padding: 8px 10px; font-size: 12.5px; text-align: left; vertical-align: top; }
  th { background: #1F4E78; color: white; position: sticky; top: 0; cursor: pointer; user-select:none; }
  tr:nth-child(even) { background: #f2f6fb; }
  .badge { display:inline-block; padding:2px 7px; border-radius: 10px; font-size: 11px; font-weight:bold; }
  .badge.contract { background:#e2f0d9; color:#375623; }
  .badge.unclear { background:#fff3cd; color:#8a6d00; }
  a { color: #0563C1; }
  #empty { padding: 40px; text-align: center; color: #777; background: white; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Job Search - Live Dashboard</h1>
  <div class="meta" id="meta">Loading data/jobs.json…</div>

  <div class="counts" id="counts"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search title/company...">
    <select id="fCandidate"><option value="">All Candidates</option></select>
    <select id="fContract"><option value="">All</option><option value="yes">Likely Contract/C2C only</option></select>
  </div>

  <table id="jobtable">
    <thead>
      <tr>
        <th data-key="0">Candidate</th>
        <th data-key="1">Tech Stack</th>
        <th data-key="2">Match Score</th>
        <th data-key="3">Job Title</th>
        <th data-key="4">Company</th>
        <th data-key="5">Location</th>
        <th data-key="6">Source</th>
        <th data-key="7">Contract?</th>
        <th>Link</th>
        <th data-key="9">Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="empty" style="display:none;">No jobs.json data yet - run the GitHub Action once (Actions tab &rarr; Update job listings &rarr; Run workflow) to populate this.</div>

<script>
  async function load() {
    let data;
    try {
      const res = await fetch('data/jobs.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data file yet');
      data = await res.json();
    } catch (e) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('meta').textContent = 'No data yet.';
      return;
    }

    document.getElementById('meta').textContent =
      `Last updated: ${new Date(data.generatedAt).toLocaleString()} | ${data.totalFound} postings found (nothing auto-discarded, only ranked)`;

    const candidates = [...new Set(data.jobs.map(j => j.candidate))];
    const fCandidate = document.getElementById('fCandidate');
    candidates.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      fCandidate.appendChild(opt);
    });

    const countsEl = document.getElementById('counts');
    countsEl.innerHTML = `<div class="count-card"><b>${data.totalFound}</b>Total postings</div>` +
      candidates.map(c => `<div class="count-card"><b>${data.jobs.filter(j=>j.candidate===c).length}</b>${c}</div>`).join('');

    const tbody = document.querySelector('#jobtable tbody');
    const rows = data.jobs.map(j => {
      const tr = document.createElement('tr');
      tr.dataset.candidate = j.candidate;
      tr.dataset.contract = j.likelyContract ? 'yes' : 'no';
      tr.innerHTML = `
        <td>${j.candidate}</td>
        <td>${j.techStack}</td>
        <td>${j.matchScore}%</td>
        <td>${j.title}</td>
        <td>${j.company}</td>
        <td>${j.location}</td>
        <td>${j.source}</td>
        <td>${j.likelyContract ? '<span class="badge contract">Contract language found</span>' : '<span class="badge unclear">Unclear - verify</span>'}</td>
        <td>${j.link ? `<a href="${j.link}" target="_blank">View</a>` : '-'}</td>
        <td>${j.note}</td>
      `;
      tbody.appendChild(tr);
      return tr;
    });

    const search = document.getElementById('search');
    const fContract = document.getElementById('fContract');
    function applyFilters() {
      const q = search.value.toLowerCase();
      rows.forEach(r => {
        const matchesSearch = r.innerText.toLowerCase().includes(q);
        const matchesCandidate = !fCandidate.value || r.dataset.candidate === fCandidate.value;
        const matchesContract = !fContract.value || r.dataset.contract === fContract.value;
        r.style.display = (matchesSearch && matchesCandidate && matchesContract) ? '' : 'none';
      });
    }
    [search, fCandidate, fContract].forEach(el => el.addEventListener('input', applyFilters));

    document.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = parseInt(th.dataset.key);
        const sorted = rows.slice().sort((a, b) => {
          let av = a.children[key].innerText.trim();
          let bv = b.children[key].innerText.trim();
          const an = parseFloat(av), bn = parseFloat(bv);
          if (!isNaN(an) && !isNaN(bn)) return bn - an;
          return av.localeCompare(bv);
        });
        sorted.forEach(r => tbody.appendChild(r));
      });
    });
  }
  load();
</script>
</body>
</html>
